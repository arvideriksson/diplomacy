<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>1900 Map Editor</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #app { display: flex; height: 100vh; }
  #map { flex: 1; background: #cbc5a0; overflow: hidden; position: relative; }
  #map svg { width: 100%; height: 100%; display: block; cursor: grab; }
  #map svg.panning { cursor: grabbing; }
  path.base { pointer-events: none; stroke: #4a4636; stroke-width: 1; stroke-linejoin: round; }
  path.cell { stroke: rgba(74,70,54,0.20); stroke-width: 0.5; vector-effect: non-scaling-stroke; cursor: pointer; pointer-events: all; }
  path.cell.selected { stroke: #d11; stroke-width: 1.6; }
  #side { width: 320px; border-left: 1px solid #ccc; padding: 16px; overflow-y: auto; background: #fafafa; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .hint { color: #666; font-size: 12px; margin: 0 0 14px; line-height: 1.4; }
  input[type=text] { width: 100%; padding: 7px 9px; font-size: 14px; border: 1px solid #bbb; border-radius: 6px; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  button { padding: 7px 12px; font-size: 13px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; }
  button.primary { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
  button:disabled { opacity: .5; cursor: default; }
  .sel { margin-top: 12px; font-size: 13px; color: #333; }
  .stats { margin-top: 6px; font-size: 12px; color: #777; }
  ul { list-style: none; padding: 0; margin: 14px 0 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; font-size: 13px; }
  li:hover { background: #eee; }
  li .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid #0003; }
  li .nm { flex: 1; cursor: pointer; }
  li .ct { color: #888; font-size: 11px; }
  li .del { border: none; background: none; color: #c00; cursor: pointer; font-size: 14px; padding: 0 4px; }
  #tip { position: absolute; pointer-events: none; background: #000a; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="map"><div id="tip"></div></div>
  <div id="side">
    <h1>1900 Map Editor</h1>
    <p class="hint">Click cells to select (split by 1900 empire), or <b>Shift+drag</b> to lasso an area. Type a name and press <b>Done</b> to group them. Scroll = zoom, drag = pan. Click a saved province to re-edit.</p>
    <input id="name" type="text" placeholder="Province name (e.g. Burgundy)" autocomplete="off" />
    <div class="row">
      <button id="done" class="primary">Done</button>
      <button id="clear">Clear</button>
    </div>
    <div class="sel" id="selinfo">0 cells selected</div>
    <div class="stats" id="stats"></div>
    <ul id="list"></ul>
  </div>
</div>
<script>
const PALETTE = ['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#46f0f0','#f032e6','#bcf60c','#fabebe','#008080','#e6beff','#9a6324','#800000','#aaffc3','#808000','#ffd8b1','#000075','#a9a9a9','#e09f3e','#5f7470','#9e2a2b','#335c67','#540b0e','#6a994e'];
let UNITS, BASE_SVG = '', provinces = [], selected = new Set(), cellEl = {}, cellProv = {}, cellPts = {}, editing = null;
const $ = (id) => document.getElementById(id);

// outline points of a cell (outer ring of its first component, downsampled) — for lasso overlap
function parseRing(d) {
  const seg = (d.split('M')[1] || '').replace(/Z.*$/, '');
  const ring = seg.split('L').map((p) => p.trim().split(/\s+/).map(Number)).filter((p) => p.length === 2 && !isNaN(p[0]));
  const step = Math.max(1, Math.floor(ring.length / 16));
  const out = []; for (let i = 0; i < ring.length; i += step) out.push(ring[i]); return out;
}

async function load() {
  UNITS = await (await fetch('units.json')).json();
  for (const c of UNITS.cells) cellPts[c.id] = parseRing(c.d);
  provinces = await (await fetch('provinces.json')).json();
  BASE_SVG = await (await fetch('1900iterative.svg')).text(); // base layer linked directly to the generated map
  buildSVG();
  reindex();
  recolorAll();
  renderList();
}

function buildSVG() {
  // base layer = the inner content of 1900iterative.svg itself (loaded directly), so the
  // editor map IS the generated map; cells sit on top as a transparent interactive overlay.
  const baseInner = BASE_SVG.replace(/^[\s\S]*?<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
  const paths = UNITS.cells.map((c) =>
    `<path class="cell" data-id="${c.id}" data-name="${(c.name||'').replace(/"/g,'')}" data-country="${(c.country||'').replace(/"/g,'')}" data-empire="${c.empire}" data-out="${c.out||0}" d="${c.d}"></path>`
  ).join('');
  const map = $('map');
  map.insertAdjacentHTML('beforeend',
    `<svg id="svg" viewBox="0 0 ${UNITS.W} ${UNITS.H}" preserveAspectRatio="xMidYMid meet"><g id="baseLayer" style="pointer-events:none">${baseInner}</g><g id="cellLayer">${paths}</g></svg>`);
  for (const p of map.querySelectorAll('path.cell')) cellEl[p.dataset.id] = p;
}

function reindex() {
  cellProv = {};
  provinces.forEach((p, i) => p.cells.forEach((id) => (cellProv[id] = i)));
}

function lighten(hex, a) { return hex + a; } // hex8 alpha

function cellFill(id) {
  if (selected.has(+id)) return '#ffffffc0';          // selection highlight
  const pi = cellProv[id];
  if (pi != null) return PALETTE[pi % PALETTE.length]; // grouped province (opaque)
  const el = cellEl[id];
  // ungrouped: inside-base cells transparent (base shows). Overhang cells (beyond the base
  // coastline) are tinted so they're visible+selectable: empire overhang in its faded EMPIRE
  // colour (it's empire land), neutral geodata overhang in brown.
  if (el.dataset.out === '1') {
    const col = UNITS.empireColor[el.dataset.empire];
    return col ? col + 'aa' : 'rgba(150,96,42,0.45)';
  }
  return 'transparent';
}
function recolor(id) {
  const el = cellEl[id]; el.setAttribute('fill', cellFill(id));
  el.classList.toggle('selected', selected.has(+id));
}
function recolorAll() { for (const id in cellEl) recolor(id); $('stats').textContent = `${Object.keys(cellProv).length} / ${UNITS.cells.length} cells assigned · ${provinces.length} provinces`; }

// ── selection ──
$('svg') // placeholder; real listener attached after build
function onCellClick(id) {
  id = +id;
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  recolor(id);
  $('selinfo').textContent = `${selected.size} cells selected`;
}

$('map').addEventListener('click', (e) => {
  const p = e.target.closest('path.cell'); if (!p || dragged) return;
  onCellClick(p.dataset.id);
});
$('map').addEventListener('mousemove', (e) => {
  const p = e.target.closest('path.cell'); const tip = $('tip');
  if (p) { tip.style.display = 'block'; tip.style.left = (e.offsetX + 12) + 'px'; tip.style.top = (e.offsetY + 12) + 'px'; tip.textContent = `${p.dataset.name} · ${p.dataset.country} · ${p.dataset.empire}`; }
  else tip.style.display = 'none';
});

$('done').onclick = async () => {
  const name = $('name').value.trim();
  if (!name) { $('name').focus(); return; }
  if (!selected.size) return;
  provinces = await (await fetch('save', { method: 'POST', body: JSON.stringify({ name, cells: [...selected] }) })).json();
  selected.clear(); editing = null; $('name').value = '';
  reindex(); recolorAll(); renderList(); $('selinfo').textContent = '0 cells selected';
};
$('clear').onclick = () => { selected.forEach((id) => { const e = cellEl[id]; }); const old = [...selected]; selected.clear(); old.forEach(recolor); $('selinfo').textContent = '0 cells selected'; editing = null; $('name').value = ''; };

function renderList() {
  const ul = $('list');
  ul.innerHTML = provinces.map((p, i) =>
    `<li data-i="${i}"><span class="sw" style="background:${PALETTE[i % PALETTE.length]}"></span><span class="nm">${p.name}</span><span class="ct">${p.cells.length}</span><button class="del">×</button></li>`
  ).join('');
  for (const li of ul.children) {
    const i = +li.dataset.i;
    li.querySelector('.nm').onclick = () => { // load province into selection for editing
      const old = [...selected]; selected = new Set(provinces[i].cells); editing = provinces[i].name;
      $('name').value = provinces[i].name;
      old.forEach(recolor); selected.forEach(recolor); $('selinfo').textContent = `${selected.size} cells selected (editing ${editing})`;
    };
    li.querySelector('.del').onclick = async () => {
      provinces = await (await fetch('delete', { method: 'POST', body: JSON.stringify({ name: provinces[i].name }) })).json();
      reindex(); recolorAll(); renderList();
    };
  }
}

// ── pan / zoom / lasso (viewBox) ──
let vb, dragged = false, down = null, lasso = null;
const svgReady = () => { vb = { x: 0, y: 0, w: UNITS.W, h: UNITS.H }; applyVB(); };
function applyVB() { $('svg').setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
// account for preserveAspectRatio="meet" letterboxing so screen↔viewBox is exact
function fit() { const r = $('svg').getBoundingClientRect(); const s = Math.min(r.width / vb.w, r.height / vb.h); return { s, ox: (r.width - vb.w * s) / 2, oy: (r.height - vb.h * s) / 2, r }; }
function toVB(cx, cy) { const f = fit(); return [vb.x + (cx - f.r.left - f.ox) / f.s, vb.y + (cy - f.r.top - f.oy) / f.s]; }
function pipPoly(x, y, pts) { let inside = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1]; if (((yi > y) !== (yj > y)) && (x < ((xj - xi) * (y - yi)) / (yj - yi) + xi)) inside = !inside; } return inside; }

$('map').addEventListener('wheel', (e) => {
  e.preventDefault();
  const [mx, my] = toVB(e.clientX, e.clientY);
  const k = e.deltaY < 0 ? 0.85 : 1.18;
  vb = { w: vb.w * k, h: vb.h * k, x: mx - (mx - vb.x) * k, y: my - (my - vb.y) * k };
  applyVB();
}, { passive: false });

$('map').addEventListener('mousedown', (e) => {
  if (e.shiftKey) { // start lasso
    e.preventDefault();
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    el.setAttribute('fill', 'rgba(43,108,176,0.15)'); el.setAttribute('stroke', '#2b6cb0');
    el.setAttribute('stroke-width', '1.5'); el.setAttribute('vector-effect', 'non-scaling-stroke'); el.setAttribute('pointer-events', 'none');
    $('svg').appendChild(el);
    lasso = { pts: [toVB(e.clientX, e.clientY)], el };
    return;
  }
  down = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y }; dragged = false; $('svg').classList.add('panning');
});
window.addEventListener('mousemove', (e) => {
  if (lasso) { lasso.pts.push(toVB(e.clientX, e.clientY)); lasso.el.setAttribute('points', lasso.pts.map((p) => p.join(',')).join(' ')); return; }
  if (!down) return;
  const f = fit(), dx = (e.clientX - down.x) / f.s, dy = (e.clientY - down.y) / f.s;
  if (Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) > 4) dragged = true;
  vb.x = down.vx - dx; vb.y = down.vy - dy; applyVB();
});
window.addEventListener('mouseup', () => {
  if (lasso) {
    const pts = lasso.pts; lasso.el.remove();
    if (pts.length > 2) { for (const c of UNITS.cells) { if (selected.has(c.id)) continue; const rp = cellPts[c.id]; if (pipPoly(c.cx, c.cy, pts) || (rp && rp.some((p) => pipPoly(p[0], p[1], pts)))) { selected.add(c.id); recolor(c.id); } } $('selinfo').textContent = `${selected.size} cells selected`; }
    lasso = null; dragged = true; setTimeout(() => (dragged = false), 0); return;
  }
  if (down) $('svg').classList.remove('panning');
  down = null; setTimeout(() => (dragged = false), 0);
});

load().then(svgReady);
</script>
</body>
</html>
